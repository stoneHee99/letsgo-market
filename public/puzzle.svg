<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 707 1000">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1d40"/>
      <stop offset="0.55" stop-color="#191029"/>
      <stop offset="1" stop-color="#140a12"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9b8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffe9b8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lantern" cx="0.5" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffd98a"/>
      <stop offset="1" stop-color="#ff8c3b"/>
    </radialGradient>
    <radialGradient id="lanternGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb454" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffb454" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241432"/>
      <stop offset="1" stop-color="#170b16"/>
    </linearGradient>
  </defs>

  <rect width="707" height="1000" fill="url(#sky)"/>

  <!-- stars: spread so every puzzle piece has detail -->
  <g fill="#fdf6e8">
    <circle cx="40" cy="60" r="2.2" opacity="0.8"/><circle cx="120" cy="140" r="1.5" opacity="0.5"/>
    <circle cx="210" cy="70" r="1.8" opacity="0.7"/><circle cx="300" cy="170" r="1.4" opacity="0.45"/>
    <circle cx="390" cy="90" r="2" opacity="0.65"/><circle cx="640" cy="60" r="1.6" opacity="0.6"/>
    <circle cx="80" cy="270" r="1.6" opacity="0.5"/><circle cx="250" cy="300" r="2" opacity="0.6"/>
    <circle cx="430" cy="260" r="1.4" opacity="0.5"/><circle cx="600" cy="300" r="2.2" opacity="0.7"/>
    <circle cx="60" cy="420" r="1.8" opacity="0.55"/><circle cx="660" cy="420" r="1.5" opacity="0.5"/>
    <circle cx="30" cy="560" r="1.6" opacity="0.5"/><circle cx="680" cy="560" r="1.8" opacity="0.55"/>
    <circle cx="100" cy="640" r="1.4" opacity="0.4"/><circle cx="620" cy="660" r="1.6" opacity="0.5"/>
    <circle cx="180" cy="200" r="1.2" opacity="0.4"/><circle cx="500" cy="180" r="1.5" opacity="0.55"/>
    <circle cx="350" cy="330" r="1.3" opacity="0.4"/><circle cx="550" cy="500" r="1.4" opacity="0.45"/>
    <circle cx="160" cy="500" r="1.4" opacity="0.45"/><circle cx="460" cy="620" r="1.3" opacity="0.4"/>
  </g>
  <g stroke="#ffe9b8" stroke-width="1.4" stroke-linecap="round" opacity="0.75">
    <path d="M480 120 v14 M473 127 h14"/>
    <path d="M150 360 v12 M144 366 h12"/>
    <path d="M590 210 v12 M584 216 h12"/>
    <path d="M70 190 v10 M65 195 h10"/>
  </g>

  <!-- moon -->
  <circle cx="565" cy="150" r="130" fill="url(#moonGlow)"/>
  <circle cx="565" cy="150" r="58" fill="#ffeecb"/>
  <circle cx="545" cy="135" r="9" fill="#f2ddb0" opacity="0.7"/>
  <circle cx="585" cy="165" r="6" fill="#f2ddb0" opacity="0.6"/>
  <circle cx="562" cy="182" r="4.5" fill="#f2ddb0" opacity="0.5"/>

  <!-- lantern string -->
  <path d="M-10 150 Q 180 230 353 190 Q 500 158 717 240" fill="none" stroke="#ffdca0" stroke-opacity="0.5" stroke-width="2.5"/>
  <g>
    <g transform="translate(80,196)">
      <circle r="46" fill="url(#lanternGlow)"/>
      <rect x="-7" y="-28" width="14" height="8" rx="2" fill="#a3541f"/>
      <ellipse rx="20" ry="24" fill="url(#lantern)"/>
      <rect x="-5" y="24" width="10" height="7" rx="2" fill="#a3541f"/>
    </g>
    <g transform="translate(230,224)">
      <circle r="38" fill="url(#lanternGlow)"/>
      <rect x="-6" y="-24" width="12" height="7" rx="2" fill="#a3541f"/>
      <ellipse rx="16" ry="20" fill="url(#lantern)"/>
      <rect x="-4" y="20" width="8" height="6" rx="2" fill="#a3541f"/>
    </g>
    <g transform="translate(353,196)">
      <circle r="44" fill="url(#lanternGlow)"/>
      <rect x="-7" y="-27" width="14" height="8" rx="2" fill="#a3541f"/>
      <ellipse rx="19" ry="23" fill="url(#lantern)"/>
      <rect x="-5" y="23" width="10" height="7" rx="2" fill="#a3541f"/>
    </g>
    <g transform="translate(470,180)">
      <circle r="36" fill="url(#lanternGlow)"/>
      <rect x="-6" y="-23" width="12" height="7" rx="2" fill="#a3541f"/>
      <ellipse rx="15" ry="19" fill="url(#lantern)"/>
      <rect x="-4" y="19" width="8" height="6" rx="2" fill="#a3541f"/>
    </g>
    <g transform="translate(610,214)">
      <circle r="42" fill="url(#lanternGlow)"/>
      <rect x="-7" y="-26" width="14" height="8" rx="2" fill="#a3541f"/>
      <ellipse rx="18" ry="22" fill="url(#lantern)"/>
      <rect x="-5" y="22" width="10" height="7" rx="2" fill="#a3541f"/>
    </g>
  </g>

  <!-- title -->
  <g text-anchor="middle" font-family="'Jua','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
    <text x="353" y="420" font-size="26" letter-spacing="14" fill="#8ee3d8">함 께 가 장</text>
    <text x="353" y="516" font-size="88" font-weight="700" fill="#ffe9b8">곧은 길로</text>
    <text x="353" y="618" font-size="88" font-weight="700" fill="#ffb454">행하라</text>
    <text x="353" y="676" font-size="24" letter-spacing="6" fill="#c9bfae">여호수아 1 : 7</text>
  </g>

  <!-- market silhouette -->
  <rect x="0" y="820" width="707" height="180" fill="url(#ground)"/>
  <g>
    <!-- tent 1 -->
    <path d="M40 830 L130 760 L220 830 Z" fill="#2b1a3f"/>
    <path d="M40 830 L76 830 L130 760 Z" fill="#38224f"/>
    <rect x="62" y="830" width="136" height="90" fill="#221232"/>
    <rect x="98" y="852" width="64" height="46" rx="4" fill="#ffb454" opacity="0.85"/>
    <!-- tent 2 (center, tall) -->
    <path d="M250 820 L360 730 L470 820 Z" fill="#331f49"/>
    <path d="M250 820 L305 820 L360 730 Z" fill="#40295c"/>
    <rect x="276" y="820" width="168" height="104" fill="#251536"/>
    <rect x="316" y="844" width="88" height="56" rx="5" fill="#ffcf7d" opacity="0.9"/>
    <path d="M276 820 h168 l-10 16 h-148 Z" fill="#1c0f29"/>
    <!-- tent 3 -->
    <path d="M500 832 L580 768 L660 832 Z" fill="#2b1a3f"/>
    <path d="M500 832 L532 832 L580 768 Z" fill="#38224f"/>
    <rect x="518" y="832" width="124" height="88" fill="#221232"/>
    <rect x="548" y="852" width="60" height="44" rx="4" fill="#ffb454" opacity="0.85"/>
    <!-- little flags between tents -->
    <path d="M198 838 Q 250 862 276 842" fill="none" stroke="#ffdca0" stroke-opacity="0.4" stroke-width="2"/>
    <path d="M444 842 Q 480 864 518 844" fill="none" stroke="#ffdca0" stroke-opacity="0.4" stroke-width="2"/>
    <g fill="#8ee3d8" opacity="0.8">
      <path d="M222 844 l10 4 -10 4 Z"/><path d="M246 852 l10 4 -10 4 Z"/>
      <path d="M466 850 l10 4 -10 4 Z"/><path d="M492 856 l10 4 -10 4 Z"/>
    </g>
  </g>

  <text x="353" y="962" text-anchor="middle" font-size="19" letter-spacing="3" fill="#b8a98e"
    font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">2026 청년봉사선교회 여름수련회</text>
</svg>
